name: W5-002 trusted sandbox speculative plan

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed 40-character commit on main
        required: true
        type: string

permissions: {}

concurrency:
  group: w5-002-plan-sandbox
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject an unapproved repository, ref, source, or environment
        shell: bash
        env:
          APPROVED_REPOSITORY: gprai/enterprize_ai_platform
          APPROVED_REF: refs/heads/main
          APPROVED_ENVIRONMENT: sandbox
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          test "$GITHUB_REPOSITORY" = "$APPROVED_REPOSITORY"
          test "$GITHUB_REF" = "$APPROVED_REF"
          test "$REQUESTED_SOURCE" = "$GITHUB_SHA"
          test "$APPROVED_ENVIRONMENT" = "sandbox"
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the exact approved source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          cache: ""
      - name: Set up exact Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Install the hash-locked CI environment
        shell: bash
        run: |
          python --version | grep -Fx "Python 3.13.15"
          python -B tools/w5_002_ci.py validate-locks \
            --runtime requirements-runtime.lock --ci requirements-ci.lock \
            --checkov requirements-checkov.lock
          python -m pip install --require-hashes --no-deps -r requirements-ci.lock
          python -m pip --version | grep -F "pip 26.2.1"
          python -m pip check
      - name: Revalidate before requesting the OIDC token
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "gprai/enterprize_ai_platform"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          python -B tools/w5_002_ci.py validate-config --config configs/ci/w5-002.json
      - name: Assume only the approved sandbox role through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ap-southeast-1
          audience: sts.amazonaws.com
          role-duration-seconds: 900
          role-session-name: w5-002-plan-sandbox
          role-to-assume: arn:aws:iam::526338061652:role/enterprise-ai-platform-sandbox-github-oidc
      - name: Create only a backend-disabled, refresh-disabled speculative plan
        shell: bash
        env:
          PLAN_FILE: ${{ runner.temp }}/w5-002-sandbox.tfplan
          PLAN_JSON: ${{ runner.temp }}/w5-002-sandbox-plan.json
        run: |
          trap 'rm -f -- "$PLAN_FILE" "$PLAN_JSON"' EXIT
          terraform -chdir=infra/environments/sandbox init -backend=false -lockfile=readonly
          terraform -chdir=infra/environments/sandbox plan \
            -var-file=terraform.tfvars.example -refresh=false -lock=false \
            -input=false -out="$PLAN_FILE"
          terraform -chdir=infra/environments/sandbox show -json "$PLAN_FILE" > "$PLAN_JSON"
          mkdir -p reports/w5-002
          python -B tools/w5_002_ci.py write-plan-summary \
            --input "$PLAN_JSON" \
            --output reports/w5-002/terraform-plan-summary.json \
            --source-commit "${{ inputs.source_commit }}" \
            --generated-at "$(date --utc +%Y-%m-%dT%H:%M:%S+00:00)"
          rm -f -- "$PLAN_FILE" "$PLAN_JSON"
          trap - EXIT
          python -B tools/w5_002_ci.py validate-reports \
            --reports-dir reports/w5-002 --profile plan
      - name: Upload only the redacted plan summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w5-002-plan-summary
          path: reports/w5-002/terraform-plan-summary.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
