[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["enterprise_ai_platform"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tools/record_test_evidence.py", "tools/bedrock_owner_verify.py", "tools/platformctl", "tools/releasectl.py"]
strict = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider -p no:deepeval -m \"not aws and not paid\""
markers = [
    "unit: isolated deterministic behavior",
    "integration: interaction between local components or configuration",
    "contract: machine-readable interface and schema guarantees",
    "feature: behavior mapped to an approved feature ID",
    "smoke: minimal startup or command-path confidence",
    "security: security and privacy control verification",
    "teardown: cleanup and residual-resource verification",
    "aws: opt-in test requiring explicit AWS access approval",
    "paid: opt-in test that may incur platform cost",
]
