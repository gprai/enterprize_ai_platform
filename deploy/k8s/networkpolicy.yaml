apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-default-deny
  namespace: enterprise-ai-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-dns-egress
  namespace: enterprise-ai-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
