apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-default-deny
  namespace: enterprise-ai-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-dns-egress
  namespace: enterprise-ai-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-api-ingress
  namespace: enterprise-ai-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enterprise-ai-sandbox
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-private-aws-egress
  namespace: enterprise-ai-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.60.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-ai-pod-identity-egress
  namespace: enterprise-ai-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
