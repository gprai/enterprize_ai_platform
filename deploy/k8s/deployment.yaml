apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-api
  namespace: enterprise-ai-sandbox
  annotations:
    checkov.io/skip1: CKV_K8S_43=Both images are non-deployable source sentinels; release validation requires immutable digests.
  labels:
    app.kubernetes.io/name: enterprise-ai-api
    app.kubernetes.io/part-of: enterprise-ai-platform
    enterprise-ai.vayunetrix.com/artifact-type: w6-001-source-template
    enterprise-ai.vayunetrix.com/deployable: "false"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-ai-api
        app.kubernetes.io/part-of: enterprise-ai-platform
    spec:
      serviceAccountName: enterprise-ai-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: enterprise-ai.invalid/w6-001:OWNER_BINDING_REQUIRED
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: enterprise-ai-runtime
          env:
            - name: ENTERPRISE_AI_SANDBOX_AUTH_SIGNING_KEY_FILE
              value: /var/run/secrets/enterprise-ai/sandbox-auth-signing-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: sandbox-auth-signing-key
              mountPath: /var/run/secrets/enterprise-ai
              readOnly: true
        - name: otel-collector
          image: enterprise-ai.invalid/w6-004-otel:OWNER_BINDING_REQUIRED
          imagePullPolicy: Always
          args:
            - --config=/etc/otelcol/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
            - name: otel-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: otel-config
          configMap:
            name: enterprise-ai-otel-collector
        - name: otel-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: sandbox-auth-signing-key
          secret:
            secretName: enterprise-ai-runtime-secrets # pragma: allowlist secret
            defaultMode: 0440
            items:
              - key: sandbox-auth-signing-key
                path: sandbox-auth-signing-key
