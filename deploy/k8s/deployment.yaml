apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-api
  namespace: enterprise-ai-sandbox
  annotations:
    checkov.io/skip1: CKV_K8S_43=The sole image is the approved non-deployable source sentinel; release validation requires an immutable digest.
  labels:
    app.kubernetes.io/name: enterprise-ai-api
    app.kubernetes.io/part-of: enterprise-ai-platform
    enterprise-ai.vayunetrix.com/artifact-type: w6-001-source-template
    enterprise-ai.vayunetrix.com/deployable: "false"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-ai-api
        app.kubernetes.io/part-of: enterprise-ai-platform
    spec:
      serviceAccountName: enterprise-ai-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: enterprise-ai.invalid/w6-001:OWNER_BINDING_REQUIRED
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: enterprise-ai-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
