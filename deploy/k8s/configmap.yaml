apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-ai-runtime
  namespace: enterprise-ai-sandbox
data:
  ENTERPRISE_AI_API_ROUTES_ENABLED: "true"
  ENTERPRISE_AI_AWS_COMPOSITION_ENABLED: "true"
  ENTERPRISE_AI_EMBEDDING_MODEL_ID: sentence-transformers/all-MiniLM-L6-v2
  ENTERPRISE_AI_EMBEDDING_SNAPSHOT_PATH: /app/enterprise_ai_platform/models/1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  ENTERPRISE_AI_OPENSEARCH_INDEX_NAME: enterprise_ai_sandbox
  ENTERPRISE_AI_OPENSEARCH_URL: https://OWNER_BINDING_REQUIRED
  ENTERPRISE_AI_QDRANT_URL: http://127.0.0.1:6333
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  ENTERPRISE_AI_TELEMETRY_ENABLED: "true"
  ENTERPRISE_AI_TELEMETRY_EXPORTER: otlp_grpc
  ENTERPRISE_AI_TELEMETRY_OTLP_ENDPOINT: http://127.0.0.1:4317
  ENTERPRISE_AI_TELEMETRY_QUEUE_CAPACITY: "512"
  ENTERPRISE_AI_TELEMETRY_BATCH_SIZE: "64"
  ENTERPRISE_AI_TELEMETRY_EXPORT_DELAY_SECONDS: "1.0"
  ENTERPRISE_AI_TELEMETRY_EXPORT_TIMEOUT_SECONDS: "1.0"
  ENTERPRISE_AI_TELEMETRY_BACKGROUND_WORKERS: "1"
  ENTERPRISE_AI_TELEMETRY_FLUSH_TIMEOUT_SECONDS: "2.0"
  ENTERPRISE_AI_TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS: "2.0"
  ENTERPRISE_AI_SANDBOX_AUTH_ENABLED: "true"
  ENTERPRISE_AI_SANDBOX_AUTH_ISSUER: enterprise-ai-sandbox
  ENTERPRISE_AI_SANDBOX_AUTH_AUDIENCE: enterprise-ai-api
  ENTERPRISE_AI_SANDBOX_AUTH_TENANT_ID: synthetic-sandbox-tenant
  ENTERPRISE_AI_LLM_PROVIDER: bedrock
  ENTERPRISE_AI_LLM_MODEL_ID: OWNER_BINDING_REQUIRED
  ENTERPRISE_AI_AWS_REGION: ap-southeast-1
