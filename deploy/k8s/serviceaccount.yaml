apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-ai-runtime
  namespace: enterprise-ai-sandbox
  labels:
    app.kubernetes.io/part-of: enterprise-ai-platform
    enterprise-ai.vayunetrix.com/identity: eks-pod-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-ai-ingestion
  namespace: enterprise-ai-sandbox
  labels:
    app.kubernetes.io/part-of: enterprise-ai-platform
    enterprise-ai.vayunetrix.com/identity: eks-pod-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fis-experiment
  namespace: enterprise-ai-sandbox
  labels:
    app.kubernetes.io/part-of: enterprise-ai-platform
    enterprise-ai.vayunetrix.com/purpose: bounded-resilience-experiment
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-pod-delete
  namespace: enterprise-ai-sandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "list", "get", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-pod-delete
  namespace: enterprise-ai-sandbox
subjects:
  - kind: ServiceAccount
    name: fis-experiment
    namespace: enterprise-ai-sandbox
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: fis-experiment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fis-pod-delete
