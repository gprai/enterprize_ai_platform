apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-ai-trust
  labels:
    enterprise-ai.vayunetrix.com/purpose: reviewed-trust-root
---
# Root Secret is created in an owner-approved bootstrap ceremony. No root
# Certificate resource is retained, so the one-year CA cannot auto-renew.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: enterprise-ai-capstone-ca
spec:
  ca:
    secretName: enterprise-ai-capstone-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: enterprise-ai-api-tls
  namespace: enterprise-ai-sandbox
spec:
  secretName: enterprise-ai-api-tls
  duration: 4h
  renewBeforePercentage: 50
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - server auth
  dnsNames:
    - enterprise-ai-api.enterprise-ai-sandbox.svc.cluster.local
    - localhost
  issuerRef:
    name: enterprise-ai-capstone-ca
    kind: ClusterIssuer
    group: cert-manager.io
