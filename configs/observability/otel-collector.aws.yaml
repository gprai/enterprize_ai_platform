# W6-002 deployment-readiness input. W6-004 owns deployment and live validation.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    send_batch_size: 64
    timeout: 1s

exporters:
  awsxray:
    region: ap-southeast-1
    max_retries: 1
  awsemf:
    region: ap-southeast-1
    namespace: EnterpriseAI/Sandbox
    log_group_name: /aws/enterprise-ai-platform/sandbox/application
    log_retention: 14
    max_retries: 1
  awscloudwatchlogs:
    region: ap-southeast-1
    log_group_name: /aws/enterprise-ai-platform/sandbox/application
    log_stream_name: enterprise-ai-api

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awscloudwatchlogs]
