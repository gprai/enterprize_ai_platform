groups:
  - name: enterprise-ai-w6-002-recording
    interval: 30s
    rules:
      - record: enterprise_ai:eligible_requests:rate5m
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[5m]))
      - record: enterprise_ai:failed_requests:rate5m
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",
            outcome=~"error|timeout|budget_exceeded|cancelled"
          }[5m]))
      - record: enterprise_ai:availability:ratio30d
        expr: >-
          1 - (
            sum(increase(enterprise_ai_stage_executions_total{
              stage="api",operation="request",
              outcome=~"error|timeout|budget_exceeded|cancelled"
            }[30d]))
            / sum(increase(enterprise_ai_stage_executions_total{
              stage="api",operation="request",outcome!="denied",outcome!="rejected"
            }[30d]))
          )

  - name: enterprise-ai-w6-002-alerts
    rules:
      - alert: EnterpriseAIAvailabilityFastBurn
        expr: >-
          (enterprise_ai:failed_requests:rate5m
          / clamp_min(enterprise_ai:eligible_requests:rate5m, 1) > (14.4 * 0.001))
          and sum(increase(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[5m])) >= 20
        for: 5m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIAvailabilitySlowBurn
        expr: >-
          ((1 - enterprise_ai:availability:ratio30d) > (6 * 0.001))
          and sum(increase(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[30m])) >= 20
        for: 30m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAILatencyP95High
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(
            enterprise_ai_stage_duration_seconds_bucket{stage="api",operation="request"}[5m]
          ))) >= 4
        for: 5m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAILatencyP99High
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(
            enterprise_ai_stage_duration_seconds_bucket{stage="api",operation="request"}[5m]
          ))) >= 10
        for: 5m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIRetrievalLatencyP99High
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(
            enterprise_ai_stage_duration_seconds_bucket{
              stage="retrieval",operation="retrieve"
            }[5m]
          ))) >= 0.75
        for: 5m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAITelemetryExportFailure
        expr: increase(enterprise_ai_telemetry_export_failures_total[5m]) > 0
        for: 1m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAITelemetryQueueDrop
        expr: increase(enterprise_ai_telemetry_dropped_total{reason="capacity"}[5m]) > 0
        for: 1m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIReadinessFailure
        expr: enterprise_ai_readiness == 0
        for: 2m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIRetryStorm
        expr: >-
          rate(enterprise_ai_dependency_attempts_total[5m])
          / clamp_min(enterprise_ai:eligible_requests:rate5m, 1) > 1
        for: 5m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAISafetyViolation
        expr: increase(enterprise_ai_safety_violations_total[5m]) > 0
        for: 0m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}

  - name: enterprise-ai-w11-001-recording
    interval: 30s
    rules:
      - record: enterprise_ai:eligible_requests:rate1h
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[1h]))
      - record: enterprise_ai:failed_requests:rate1h
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",
            outcome=~"error|timeout|budget_exceeded|cancelled"
          }[1h]))
      - record: enterprise_ai:eligible_requests:rate30m
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[30m]))
      - record: enterprise_ai:failed_requests:rate30m
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",
            outcome=~"error|timeout|budget_exceeded|cancelled"
          }[30m]))
      - record: enterprise_ai:eligible_requests:rate6h
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[6h]))
      - record: enterprise_ai:failed_requests:rate6h
        expr: >-
          sum(rate(enterprise_ai_stage_executions_total{
            stage="api",operation="request",
            outcome=~"error|timeout|budget_exceeded|cancelled"
          }[6h]))

  - name: enterprise-ai-w11-001-alerts
    rules:
      - alert: EnterpriseAIAvailabilityFastBurnW11
        expr: >-
          ((enterprise_ai:failed_requests:rate5m
          / clamp_min(enterprise_ai:eligible_requests:rate5m, 1)) > (14.4 * 0.001))
          and ((enterprise_ai:failed_requests:rate1h
          / clamp_min(enterprise_ai:eligible_requests:rate1h, 1)) > (14.4 * 0.001))
          and sum(increase(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[5m])) >= 20
        for: 5m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIAvailabilitySlowBurnW11
        expr: >-
          ((enterprise_ai:failed_requests:rate30m
          / clamp_min(enterprise_ai:eligible_requests:rate30m, 1)) > (6 * 0.001))
          and ((enterprise_ai:failed_requests:rate6h
          / clamp_min(enterprise_ai:eligible_requests:rate6h, 1)) > (6 * 0.001))
          and sum(increase(enterprise_ai_stage_executions_total{
            stage="api",operation="request",outcome!="denied",outcome!="rejected"
          }[30m])) >= 20
        for: 30m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIErrorBudgetExhausted
        expr: enterprise_ai_ai_reliability_error_budget_remaining_ratio <= 0
        for: 0m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAISLIEvidenceIndeterminate
        expr: >-
          enterprise_ai_ai_reliability_decision{
            outcome=~"indeterminate|not_run"
          } > 0
        for: 0m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAISLIBreach
        expr: enterprise_ai_ai_reliability_decision{outcome="fail"} > 0
        for: 0m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}

  - name: enterprise-ai-w10-004-alerts
    rules:
      - alert: EnterpriseAICostGuardDenied
        expr: increase(enterprise_ai_ai_cost_guard_decisions_total{outcome="denied"}[5m]) > 0
        for: 0m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIConfigurationDrift
        expr: enterprise_ai_ai_configuration_drift > 0
        for: 1m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIModelDependencyUnavailable
        expr: enterprise_ai_ai_dependency_availability{dependency="model"} < 1
        for: 1m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIRetrievalDependencyUnavailable
        expr: enterprise_ai_ai_dependency_availability{dependency="retrieval"} < 1
        for: 1m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIRetrievalQualityLow
        expr: enterprise_ai_ai_retrieval_quality < 0.85
        for: 5m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIGroundednessLow
        expr: enterprise_ai_ai_groundedness < 0.95
        for: 5m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAICitationCoverageLow
        expr: enterprise_ai_ai_citation_coverage < 1
        for: 5m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIBackpressure
        expr: increase(enterprise_ai_ai_admission_decisions_total{reason="backpressure"}[5m]) > 0
        for: 1m
        labels: {severity: warning, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIPiiFailure
        expr: increase(enterprise_ai_stage_executions_total{stage="guardrail",outcome="rejected"}[5m]) > 0
        for: 0m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
      - alert: EnterpriseAIAuthorizationFailure
        expr: increase(enterprise_ai_stage_executions_total{stage="authorization",outcome="denied"}[5m]) > 0
        for: 0m
        labels: {severity: critical, ownership_ref: role:platform-observability-primary, destination_ref: external:owner-approved-alert-destination}
